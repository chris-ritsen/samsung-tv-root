[project]
name = "samsung-tv-root"
version = "0.0.1"
description = "Samsung QN90B and QN90F root research tooling"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
samsung-tv-root = "samsung_tv_root.cli:main"

[dependency-groups]
dev = [
    "pyinstaller==6.16.0",
    "pytest>=8.4.0",
    "ruff==0.16.3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.uv]
managed = true
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/samsung_tv_root"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
